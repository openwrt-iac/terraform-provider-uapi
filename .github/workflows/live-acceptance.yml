name: Live acceptance

# Manually triggered acceptance run against a real uapi router. The default CI
# acceptance job runs against the in-process mock on every PR; this one is for
# verifying the provider end to end against hardware (strict ints, snake_case,
# 429/pagination). It creates and destroys resources, so point it at a test
# router only.
#
# HAVE CONSOLE ACCESS TO THE TARGET BEFORE STARTING THIS.
#
# The suite covers uapi_network_* too, and those reconfigure the interfaces the
# run itself arrives over. A `uapi_network_bridge_vlan` create has taken a test
# box off the network mid-suite: the create succeeded, the bridge reconfigured,
# and every later call failed with "no route to host", including the delete. The
# section stays committed in uci, so the box does not recover on its own and
# needs `uci delete network.<id>` from the console. "It is a test box" covers the
# data on it, not your ability to reach it.
#
# Against a target you can only reach over the network, either be ready to use
# the console, or scope the run away from the network resources, e.g.
#   -run 'TestAccAllResources/uapi_(firewall|dhcp|system|snmpd|...)'
on:
  workflow_dispatch:
    inputs:
      endpoint:
        description: "uapi v2 endpoint, e.g. https://router.example.com/api/v2"
        required: true

permissions:
  contents: read

jobs:
  live:
    name: live acceptance (real router)
    runs-on: ubuntu-latest
    environment: live-acceptance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - name: endpoint-agnostic acceptance against the live router
        env:
          UAPI_ACC_ENDPOINT: ${{ inputs.endpoint }}
          UAPI_ACC_TOKEN: ${{ secrets.UAPI_ACC_TOKEN }}
        run: TF_ACC=1 go test ./internal/provider/ -run TestAccAllResources -count=1 -timeout 30m -v
